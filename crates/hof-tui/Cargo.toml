[package]
name = "hof-tui"
description = "Terminal UI client for Hofvarpnir"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "hofvarpnir-tui"
path = "src/main.rs"

[dependencies]
tokio.workspace = true
# `query`: RequestBuilder::query() is feature-gated in reqwest 0.13.
reqwest = { workspace = true, features = ["query"] }
ratatui.workspace = true
# `event-stream` provides crossterm's async EventStream used by the event loop.
crossterm = { workspace = true, features = ["event-stream"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
thiserror.workspace = true
color-eyre.workspace = true
tracing.workspace = true
futures.workspace = true
toml.workspace = true

[dev-dependencies]
tempfile = "3"
wiremock.workspace = true

[lints]
workspace = true
