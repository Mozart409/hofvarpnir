# Lefthook configuration for Rust project
# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    - name: clippy
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings
      stage_fixed: true
    - name: sqruff
      glob: "**/*.sql"
      run: sqruff fix {staged_files}
      stage_fixed: true
    - name: sqlx-prepare
      glob: "crates/hof-core/migrations/*.sql"
      run: just prepare
      stage_fixed: true
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint
      stage_fixed: true
    - name: keep-sorted
      glob: "flake.nix"
      run: keep-sorted flake.nix
      stage_fixed: true
    - name: css-build
      glob: "{crates/hof-web/src/**/*.rs,crates/hof-web/assets/input.css}"
      run: just css-build
      stage_fixed: true
    - name: cargo-deny
      glob: "Cargo.{toml,lock}"
      run: cargo deny check
      stage_fixed: true
pre-push:
  parallel: true
  jobs:
    - name: test
      run: just test
    - name: container-smoke
      run: |
        set -euo pipefail

        cleanup() {
          docker rm -f hof-smoke-app hof-smoke-db >/dev/null 2>&1 || true
          docker network rm hof-smoke >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        nix build --impure .#container
        docker load < result

        docker network create hof-smoke >/dev/null 2>&1 || true
        docker run -d --name hof-smoke-db --network hof-smoke \
          -e POSTGRES_USER=postgres \
          -e POSTGRES_PASSWORD=postgres \
          -e POSTGRES_DB=hofvarpnir_dev \
          postgres:17 >/dev/null

        for i in $(seq 1 60); do
          if docker exec hof-smoke-db pg_isready -U postgres >/dev/null 2>&1; then
            break
          fi
          sleep 1
        done

        docker run -d --name hof-smoke-app --network hof-smoke -p 13000:3000 \
          -e DATABASE_URL=postgresql://postgres:postgres@hof-smoke-db:5432/hofvarpnir_dev \
          -e PORT=3000 \
          -e DEFAULT_OUTPUT_DIR=/data/downloads \
          -e YTDLP_PATH=/bin/yt-dlp \
          hofvarpnir:latest >/dev/null

        for i in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:13000/api/health/ready >/dev/null; then
            break
          fi
          if ! docker ps --format '{{.Names}}' | grep -q '^hof-smoke-app$'; then
            docker logs hof-smoke-app
            exit 1
          fi
          sleep 1
        done

        # Verify health endpoint is reachable (final check after loop)
        if ! curl -fsS http://127.0.0.1:13000/api/health/ready >/dev/null; then
          echo "Health check failed after timeout"
          docker logs hof-smoke-app
          exit 1
        fi

        # Verify static assets are served correctly
        if ! curl -fsS http://127.0.0.1:13000/assets/app.css >/dev/null; then
          echo "Static asset app.css not found - assets directory missing from container"
          docker logs hof-smoke-app
          exit 1
        fi

        echo "Smoke test passed: health endpoint and static assets OK"
    - name: clippy-all
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: sqruff
      glob: "**/*.sql"
      run: sqruff lint
      stage_fixed: true
