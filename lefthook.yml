# Lefthook configuration for Rust project
# https://lefthook.dev/configuration/
pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    - name: clippy
      glob: "*.rs"
      run: cargo clippy --all-targets -- -D warnings
      stage_fixed: true
    - name: sqruff
      glob: "**/*.sql"
      run: sqruff fix {staged_files}
      stage_fixed: true
    - name: sqlx-prepare
      glob: "crates/hof-core/migrations/*.sql"
      run: just prepare
      stage_fixed: true
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint
      stage_fixed: true
    - name: keep-sorted
      glob: "flake.nix"
      run: keep-sorted flake.nix
      stage_fixed: true
    - name: css-build
      glob: "{crates/hof-web/src/**/*.rs,crates/hof-web/assets/input.css}"
      run: just css-build
      stage_fixed: true
    - name: cargo-deny
      glob: "Cargo.{toml,lock}"
      run: cargo deny check
      stage_fixed: true
pre-push:
  parallel: true
  jobs:
    - name: test
      run: just test
    - name: container-smoke
      run: nix build --impure .#container && docker load < result && docker run --rm --entrypoint /bin/sh hofvarpnir:latest -c 'test -x /bin/hofvarpnir'
    - name: clippy-pedantic
      glob: "*.rs"
      run: cargo clippy --all-targets -- -W clippy::pedantic
    - name: sqruff
      glob: "**/*.sql"
      run: sqruff lint
      stage_fixed: true
