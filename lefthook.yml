# Lefthook configuration for Rust project
# https://lefthook.dev/configuration/
commit-msg:
  jobs:
    - name: cog verify
      run: cog verify --file {1}
pre-commit:
  parallel: true
  jobs:
    - name: just format
      glob: "justfile"
      run: just --fmt
      stage_fixed: true
    - name: format
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    - name: clippy
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic -D clippy::nursery
      stage_fixed: true
    - name: sqruff
      glob: "**/*.sql"
      run: sqruff fix {staged_files}
      stage_fixed: true
    - name: sqlx-prepare
      glob: "crates/hof-core/migrations/*.sql"
      run: just prepare
      stage_fixed: true
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint
      stage_fixed: true
    - name: keep-sorted
      run: keep-sorted {staged_files}
      stage_fixed: true
    - name: css-build
      glob: "{crates/hof-web/src/**/*.rs,crates/hof-web/assets/input.css}"
      run: just css-build
      stage_fixed: true
    - name: cargo-deny
      glob: "Cargo.{toml,lock}"
      run: cargo deny check
      stage_fixed: true
pre-push:
  parallel: true
  jobs:
    - name: sqlx-prepare
      run: just prepare
      stage_fixed: true
    - name: test
      glob:
        - "*.rs"
        - "**/*.sql"
        - "Cargo.{toml,lock}"
      run: just test
    - name: clippy-all
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets --all-features -- -D warnings -D clippy::pedantic -D clippy::nursery
    # The vendored crates declare their own [workspace], so the root
    # workspace only builds their lib target as a [patch.crates-io]
    # dependency -- their tests/examples are compiled by nothing above.
    - name: patches-check
      glob: "patches/**/*.rs"
      root: "patches/yt-dlp-patched/"
      run: cargo check --all-targets --all-features
    # Scoped to the files in the push. Bare `sqruff lint` re-lints all 35 SQL
    # files, including migrations applied long ago -- reformatting those would
    # change their sqlx checksum and break `migrate run` against every existing
    # database, so linting them on every push can only ever block it.
    - name: sqruff
      glob: "**/*.sql"
      run: sqruff lint {push_files}
