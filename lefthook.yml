# Lefthook configuration for Rust project
# https://lefthook.dev/configuration/
commit-msg:
  jobs:
    - name: cog verify
      run: cog verify --file {1}
pre-commit:
  parallel: true
  jobs:
    - name: just format
      glob: "justfile"
      run: just --fmt
      stage_fixed: true
    - name: format
      glob: "*.rs"
      run: cargo fmt
      stage_fixed: true
    - name: clippy
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings
      stage_fixed: true
    - name: sqruff
      glob: "**/*.sql"
      run: sqruff fix {staged_files}
      stage_fixed: true
    - name: sqlx-prepare
      glob: "crates/hof-core/migrations/*.sql"
      run: just prepare
      stage_fixed: true
    - name: actionlint
      glob: ".github/workflows/*.{yml,yaml}"
      run: actionlint
      stage_fixed: true
    - name: keep-sorted
      run: keep-sorted {staged_files}
      stage_fixed: true
    - name: css-build
      glob: "{crates/hof-web/src/**/*.rs,crates/hof-web/assets/input.css}"
      run: just css-build
      stage_fixed: true
    - name: cargo-deny
      glob: "Cargo.{toml,lock}"
      run: cargo deny check
      stage_fixed: true
pre-push:
  parallel: true
  jobs:
    - name: test
      glob:
        - "*.rs"
        - "**/*.sql"
        - "Cargo.{toml,lock}"
      run: just test
    - name: clippy-all
      glob: "*.rs"
      run: cargo clippy --all-targets --all-features -- -D warnings
    - name: sqruff
      glob: "**/*.sql"
      run: sqruff lint
      stage_fixed: true
