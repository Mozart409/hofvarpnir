name: Release
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  build:
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@main
      - name: Build binaries
        run: |
          nix develop .#default --command cargo build --release --bin hofvarpnir --bin hofvarpnir-tui
          mkdir -p dist
          cp target/release/hofvarpnir dist/hofvarpnir-${{ matrix.target }}
          cp target/release/hofvarpnir-tui dist/hofvarpnir-tui-${{ matrix.target }}
      - name: Create tarball
        run: |
          tar -czf hofvarpnir-${{ matrix.target }}-${{ github.ref_name }}.tar.gz -C dist .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hofvarpnir-${{ matrix.target }}
          path: hofvarpnir-${{ matrix.target }}-${{ github.ref_name }}.tar.gz
  container:
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@main
      - name: Build container
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export OCI_IMAGE_VERSION="$VERSION"
          export OCI_IMAGE_REVISION="${{ github.sha }}"
          OCI_IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export OCI_IMAGE_CREATED
          nix build --impure .#container
      - name: Upload container image
        uses: actions/upload-artifact@v7
        with:
          name: container-${{ matrix.arch }}
          path: result
          retention-days: 1
  container-manifest:
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Download container images
        uses: actions/download-artifact@v8
        with:
          pattern: container-*
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifests
        env:
          REPO_RAW: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          REPO="ghcr.io/${REPO_RAW,,}"

          # Build the multi-arch manifest from local archives
          buildah manifest create hofvarpnir
          buildah manifest add hofvarpnir docker-archive:container-amd64/result
          buildah manifest add hofvarpnir docker-archive:container-arm64/result

          # Push once to the version tag
          buildah manifest push --all hofvarpnir "docker://${REPO}:${VERSION}"

          # Tag the pushed manifest for other tags (no re-push of images)
          skopeo copy --all "docker://${REPO}:${VERSION}" "docker://${REPO}:${MAJOR_MINOR}"
          skopeo copy --all "docker://${REPO}:${VERSION}" "docker://${REPO}:latest"
  release:
    needs: [build, container-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Derive image tag
        id: vars
        run: |
          echo "image_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Container Image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.image_tag }}
            ```
      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*.tar.gz
