name: Release
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  build:
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: hofvarpnir
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build binaries
        run: |
          nix develop .#ci --command cargo build --release --bin hofvarpnir --bin hofvarpnir-tui
          mkdir -p dist
          cp target/release/hofvarpnir dist/hofvarpnir-${{ matrix.target }}
          cp target/release/hofvarpnir-tui dist/hofvarpnir-tui-${{ matrix.target }}
      - name: Create tarball
        run: |
          tar -czf hofvarpnir-${{ matrix.target }}-${{ github.ref_name }}.tar.gz -C dist .
      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hofvarpnir-${{ matrix.target }}
          path: hofvarpnir-${{ matrix.target }}-${{ github.ref_name }}.tar.gz
      - name: Upload binary for container
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: target/release/hofvarpnir
          retention-days: 1
  container:
    needs: build
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-${{ matrix.target }}
          path: ./bin
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: hofvarpnir
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build container from binary
        run: |
          chmod +x ./bin/hofvarpnir
          VERSION="${GITHUB_REF_NAME#v}"
          HOFVARPNIR_BINARY="$(pwd)/bin/hofvarpnir"
          export HOFVARPNIR_BINARY
          export OCI_IMAGE_VERSION="$VERSION"
          export OCI_IMAGE_REVISION="${{ github.sha }}"
          OCI_IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export OCI_IMAGE_CREATED
          # --fallback: build a dependency from source if its binary-cache
          # substitute fails (e.g. a corrupted NAR on cache.nixos.org).
          nix build --impure --fallback .#containerFromBinary
      - name: Upload container image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-${{ matrix.arch }}
          path: result
          retention-days: 1
  container-manifest:
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Download container images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: container-*
      - name: Login to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifests
        env:
          REPO_RAW: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          REPO="ghcr.io/${REPO_RAW,,}"

          # Build the multi-arch manifest from local archives
          buildah manifest create hofvarpnir
          buildah manifest add hofvarpnir docker-archive:container-amd64/result
          buildah manifest add hofvarpnir docker-archive:container-arm64/result

          # Docker rejects GHCR tags that are published only as OCI indexes.
          buildah manifest push --all --format v2s2 hofvarpnir "docker://${REPO}:${VERSION}"
          buildah manifest push --all --format v2s2 hofvarpnir "docker://${REPO}:${MAJOR_MINOR}"
          buildah manifest push --all --format v2s2 hofvarpnir "docker://${REPO}:latest"

          # Keep a pure OCI variant available for OCI-native consumers.
          buildah manifest push --all --format oci hofvarpnir "docker://${REPO}:${VERSION}-oci"
      - name: Verify pushed manifests resolve
        env:
          REPO_RAW: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          REPO="ghcr.io/${REPO_RAW,,}"

          # Fetch the index AND every per-arch child manifest it references.
          # `docker manifest inspect` only reads the index, so it passes even
          # when the platform children are missing (the failure mode that broke
          # older tags). Pulling each child digest is cheap (manifest JSON, not
          # layers) and reproduces what `docker/podman pull` actually needs.
          verify() {
            ref="$1"
            echo "::group::verify ${ref}"
            digests="$(docker buildx imagetools inspect --raw "${ref}" | jq -r '.manifests[]?.digest')"
            if [ -z "${digests}" ]; then
              echo "::error::${ref} has no child manifests"; exit 1
            fi
            for d in ${digests}; do
              docker buildx imagetools inspect --raw "${REPO}@${d}" >/dev/null \
                || { echo "::error::${ref} -> child ${d} is unresolvable"; exit 1; }
              echo "ok  ${d}"
            done
            echo "::endgroup::"
          }

          for tag in "${VERSION}" "${MAJOR_MINOR}" latest "${VERSION}-oci"; do
            verify "${REPO}:${tag}"
          done
  release:
    needs: [build, container-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Derive image tag
        id: vars
        run: |
          echo "image_repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Container Image

            ```bash
            docker pull ${{ steps.vars.outputs.image_repo }}:${{ steps.vars.outputs.image_tag }}
            ```
      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*.tar.gz
