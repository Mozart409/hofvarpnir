name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [
          x86_64-unknown-linux-gnu,
          # Add more targets if needed for cross-compilation
        ]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Nix
        uses: cachix/install-nix-action@v24
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      
      - name: Build server binary
        run: |
          nix develop .#default --command cargo build --release --bin hofapi
          mkdir -p dist
          cp target/release/hofapi dist/hofapi-${{ matrix.target }}
      
      - name: Build TUI binary
        run: |
          nix develop .#default --command cargo build --release --bin hoftui
          cp target/release/hoftui dist/hoftui-${{ matrix.target }}
      
      - name: Create tarball
        run: |
          tar -czf hofvarpnir-${{ matrix.target }}-v${{ github.ref_name }}.tar.gz -C dist .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hofvarpnir-${{ matrix.target }}
          path: hofvarpnir-${{ matrix.target }}-v${{ github.ref_name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
      
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*.tar.gz