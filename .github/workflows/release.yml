name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          # Add more targets if needed for cross-compilation
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build binaries
        run: |
          nix develop .#default --command cargo build --release --bin hofapi --bin hoftui
          mkdir -p dist
          cp target/release/hofapi dist/hofapi-${{ matrix.target }}
          cp target/release/hoftui dist/hoftui-${{ matrix.target }}

      - name: Create tarball
        run: |
          tar -czf hofvarpnir-${{ matrix.target }}-${{ github.ref_name }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hofvarpnir-${{ matrix.target }}
          path: hofvarpnir-${{ matrix.target }}-${{ github.ref_name }}.tar.gz

  container:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute OCI metadata
        id: oci
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build minimal container
        env:
          OCI_IMAGE_VERSION: ${{ steps.version.outputs.version }}
          OCI_IMAGE_REVISION: ${{ github.sha }}
          OCI_IMAGE_CREATED: ${{ steps.oci.outputs.created }}
        run: nix build --impure .#container-minimal

      - name: Push arch-specific image to GHCR
        env:
          REPO: ${{ github.repository }}
        run: |
          nix develop .#default --command skopeo copy \
            --dest-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            docker-archive:result \
            "docker://ghcr.io/${REPO,,}:${{ steps.version.outputs.version }}-${{ matrix.arch }}"

  container-manifest:
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute OCI metadata
        id: oci
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifests
        env:
          REPO_RAW: ${{ github.repository }}
        run: |
          REPO="ghcr.io/${REPO_RAW,,}"

          VERSION="${{ steps.version.outputs.version }}"
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          CREATED="${{ steps.oci.outputs.created }}"
          REVISION="${{ github.sha }}"

          annotate_and_push() {
            local tag="$1"
            docker buildx imagetools create \
              --tag "${REPO}:${tag}" \
              --annotation "index:org.opencontainers.image.title=hofvarpnir" \
              --annotation "index:org.opencontainers.image.description=Video archival system with yt-dlp" \
              --annotation "index:org.opencontainers.image.url=https://github.com/Mozart409/hofvarpnir" \
              --annotation "index:org.opencontainers.image.source=https://github.com/Mozart409/hofvarpnir" \
              --annotation "index:org.opencontainers.image.documentation=https://github.com/Mozart409/hofvarpnir#readme" \
              --annotation "index:org.opencontainers.image.licenses=SEE LICENSES" \
              --annotation "index:org.opencontainers.image.authors=Mozart409" \
              --annotation "index:org.opencontainers.image.vendor=Mozart409" \
              --annotation "index:org.opencontainers.image.version=${VERSION}" \
              --annotation "index:org.opencontainers.image.revision=${REVISION}" \
              --annotation "index:org.opencontainers.image.created=${CREATED}" \
              "${REPO}:${VERSION}-amd64" \
              "${REPO}:${VERSION}-arm64"
          }

          # Create manifests for semver, major.minor, and latest tags
          annotate_and_push "${VERSION}"
          annotate_and_push "${MAJOR_MINOR}"
          annotate_and_push "latest"

  release:
    needs: [build, container-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Container Image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*.tar.gz
