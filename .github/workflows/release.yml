name: Release
on:
  push:
    tags:
      - 'v*.*.*'
jobs:
  build:
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: hofvarpnir
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build binaries
        run: |
          nix develop .#ci --command cargo build --release --bin hofvarpnir --bin hofvarpnir-tui
          mkdir -p dist/server dist/tui
          cp target/release/hofvarpnir dist/server/hofvarpnir-${{ matrix.target }}
          cp target/release/hofvarpnir-tui dist/tui/hofvarpnir-tui
      - name: Create tarballs
        run: |
          # Server tarball keeps the historical name; it contains only the
          # server binary since v0.15.0. The TUI ships in its own archive.
          tar -czf hofvarpnir-${{ matrix.target }}-${{ github.ref_name }}.tar.gz -C dist/server .
          tar -czf hofvarpnir-tui-${{ matrix.target }}-${{ github.ref_name }}.tar.gz -C dist/tui .
          for f in *.tar.gz; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
      - name: Upload server tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hofvarpnir-${{ matrix.target }}
          path: |
            hofvarpnir-${{ matrix.target }}-${{ github.ref_name }}.tar.gz
            hofvarpnir-${{ matrix.target }}-${{ github.ref_name }}.tar.gz.sha256
      - name: Upload TUI tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hofvarpnir-tui-${{ matrix.target }}
          path: |
            hofvarpnir-tui-${{ matrix.target }}-${{ github.ref_name }}.tar.gz
            hofvarpnir-tui-${{ matrix.target }}-${{ github.ref_name }}.tar.gz.sha256
      - name: Upload binary for container
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: target/release/hofvarpnir
          retention-days: 1
  build-tui-extra:
    # TUI-only targets that don't go through Nix: musl (static, for Alpine and
    # old-glibc machines) and macOS. hof-tui is a pure HTTP client (no hof-core,
    # no sqlx), so a plain cargo build with the pinned rust-toolchain.toml is
    # enough. rustup on the runner auto-installs the pinned nightly.
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          - runner: macos-15
            target: aarch64-apple-darwin
          # macos-15-intel is the last x86_64 macOS image (until Aug 2027).
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install musl toolchain
        if: matrix.musl
        # aws-lc-sys (rustls) compiles C code; musl-gcc is the cross compiler.
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build TUI
        run: cargo build --release -p hof-tui --target ${{ matrix.target }}
      - name: Verify musl binary is static
        if: matrix.musl
        run: |
          ! file target/${{ matrix.target }}/release/hofvarpnir-tui | grep -q "dynamically linked" \
            || { echo "::error::musl build is dynamically linked"; exit 1; }
      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/hofvarpnir-tui" dist/hofvarpnir-tui
          tar -czf "hofvarpnir-tui-${{ matrix.target }}-${{ github.ref_name }}.tar.gz" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "hofvarpnir-tui-${{ matrix.target }}-${{ github.ref_name }}.tar.gz" | cut -d' ' -f1 \
              > "hofvarpnir-tui-${{ matrix.target }}-${{ github.ref_name }}.tar.gz.sha256"
          else
            shasum -a 256 "hofvarpnir-tui-${{ matrix.target }}-${{ github.ref_name }}.tar.gz" | cut -d' ' -f1 \
              > "hofvarpnir-tui-${{ matrix.target }}-${{ github.ref_name }}.tar.gz.sha256"
          fi
      - name: Upload TUI tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hofvarpnir-tui-${{ matrix.target }}
          path: |
            hofvarpnir-tui-${{ matrix.target }}-${{ github.ref_name }}.tar.gz
            hofvarpnir-tui-${{ matrix.target }}-${{ github.ref_name }}.tar.gz.sha256
  container:
    needs: build
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-${{ matrix.target }}
          path: ./bin
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # main
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: hofvarpnir
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build container from binary
        run: |
          chmod +x ./bin/hofvarpnir
          VERSION="${GITHUB_REF_NAME#v}"
          HOFVARPNIR_BINARY="$(pwd)/bin/hofvarpnir"
          export HOFVARPNIR_BINARY
          export OCI_IMAGE_VERSION="$VERSION"
          export OCI_IMAGE_REVISION="${{ github.sha }}"
          OCI_IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export OCI_IMAGE_CREATED
          # --fallback: build a dependency from source if its binary-cache
          # substitute fails (e.g. a corrupted NAR on cache.nixos.org).
          nix build --impure --fallback .#containerFromBinary
      - name: Upload container image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-${{ matrix.arch }}
          path: result
          retention-days: 1
  container-manifest:
    needs: container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Download container images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: container-*
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifests
        env:
          REPO_RAW: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          REPO="ghcr.io/${REPO_RAW,,}"

          # Build the multi-arch manifest from local archives
          buildah manifest create hofvarpnir
          buildah manifest add hofvarpnir docker-archive:container-amd64/result
          buildah manifest add hofvarpnir docker-archive:container-arm64/result

          # Docker rejects GHCR tags that are published only as OCI indexes.
          buildah manifest push --all --format v2s2 hofvarpnir "docker://${REPO}:${VERSION}"
          buildah manifest push --all --format v2s2 hofvarpnir "docker://${REPO}:${MAJOR_MINOR}"
          buildah manifest push --all --format v2s2 hofvarpnir "docker://${REPO}:latest"

          # Keep a pure OCI variant available for OCI-native consumers.
          buildah manifest push --all --format oci hofvarpnir "docker://${REPO}:${VERSION}-oci"
      - name: Verify pushed manifests resolve
        env:
          REPO_RAW: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          REPO="ghcr.io/${REPO_RAW,,}"

          # Fetch the index AND every per-arch child manifest it references.
          # `docker manifest inspect` only reads the index, so it passes even
          # when the platform children are missing (the failure mode that broke
          # older tags). Pulling each child digest is cheap (manifest JSON, not
          # layers) and reproduces what `docker/podman pull` actually needs.
          verify() {
            ref="$1"
            echo "::group::verify ${ref}"
            digests="$(docker buildx imagetools inspect --raw "${ref}" | jq -r '.manifests[]?.digest')"
            if [ -z "${digests}" ]; then
              echo "::error::${ref} has no child manifests"; exit 1
            fi
            for d in ${digests}; do
              docker buildx imagetools inspect --raw "${REPO}@${d}" >/dev/null \
                || { echo "::error::${ref} -> child ${d} is unresolvable"; exit 1; }
              echo "ok  ${d}"
            done
            echo "::endgroup::"
          }

          for tag in "${VERSION}" "${MAJOR_MINOR}" latest "${VERSION}-oci"; do
            verify "${REPO}:${tag}"
          done
  release:
    needs: [build, build-tui-extra, container-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
      - name: Derive image tag
        id: vars
        run: |
          echo "image_repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Container Image

            ```bash
            docker pull ${{ steps.vars.outputs.image_repo }}:${{ steps.vars.outputs.image_tag }}
            ```
      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.sha256
