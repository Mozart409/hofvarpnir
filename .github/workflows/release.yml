name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    concurrency:
      group: build-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [
          x86_64-unknown-linux-gnu,
          # Add more targets if needed for cross-compilation
        ]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Nix
        uses: cachix/install-nix-action@v24
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      
      - name: Build server binary
        run: |
          nix develop .#default --command cargo build --release --bin hofapi
          mkdir -p dist
          cp target/release/hofapi dist/hofapi-${{ matrix.target }}
      
      - name: Build TUI binary
        run: |
          nix develop .#default --command cargo build --release --bin hoftui
          cp target/release/hoftui dist/hoftui-${{ matrix.target }}
      
      - name: Create tarball
        run: |
          tar -czf hofvarpnir-${{ matrix.target }}-v${{ github.ref_name }}.tar.gz -C dist .
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hofvarpnir-${{ matrix.target }}
          path: hofvarpnir-${{ matrix.target }}-v${{ github.ref_name }}.tar.gz

  container:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Separate concurrency group for container builds - don't cancel long-running builds
    concurrency:
      group: container-${{ github.workflow }}-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build minimal container
        run: nix build .#container-minimal

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Push arch-specific image to GHCR
        run: |
          nix develop .#default --command skopeo copy \
            --dest-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            docker-archive:result \
            "docker://ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}-${{ matrix.arch }}"

  container-manifest:
    needs: container
    runs-on: ubuntu-latest
    concurrency:
      group: container-manifest-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch manifests
        run: |
          nix develop .#default --command skopeo login \
            -u "${{ github.actor }}" \
            -p "${{ secrets.GITHUB_TOKEN }}" \
            ghcr.io

          VERSION="${{ steps.version.outputs.version }}"
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)
          REPO="ghcr.io/${{ github.repository }}"

          # Create manifest for semver tag (e.g., 1.2.3)
          docker manifest create "${REPO}:${VERSION}" \
            "${REPO}:${VERSION}-amd64" \
            "${REPO}:${VERSION}-arm64"
          docker manifest push "${REPO}:${VERSION}"

          # Create manifest for major.minor tag (e.g., 1.2)
          docker manifest create "${REPO}:${MAJOR_MINOR}" \
            "${REPO}:${VERSION}-amd64" \
            "${REPO}:${VERSION}-arm64"
          docker manifest push "${REPO}:${MAJOR_MINOR}"

          # Create manifest for latest tag
          docker manifest create "${REPO}:latest" \
            "${REPO}:${VERSION}-amd64" \
            "${REPO}:${VERSION}-arm64"
          docker manifest push "${REPO}:latest"

  release:
    needs: [build, container-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Container Image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
      
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*.tar.gz
