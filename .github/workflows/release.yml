name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          # Add more targets if needed for cross-compilation
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Build binaries
        run: |
          nix develop .#default --command cargo build --release --bin hofvarpnir --bin hofvarpnir-tui
          mkdir -p dist
          cp target/release/hofvarpnir dist/hofvarpnir-${{ matrix.target }}
          cp target/release/hofvarpnir-tui dist/hofvarpnir-tui-${{ matrix.target }}

      - name: Create tarball
        run: |
          tar -czf hofvarpnir-${{ matrix.target }}-${{ github.ref_name }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hofvarpnir-${{ matrix.target }}
          path: hofvarpnir-${{ matrix.target }}-${{ github.ref_name }}.tar.gz

  container:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@main

      - name: Build container
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export OCI_IMAGE_VERSION="$VERSION"
          export OCI_IMAGE_REVISION="${{ github.sha }}"
          OCI_IMAGE_CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export OCI_IMAGE_CREATED
          nix build --impure .#container

      - name: Upload container image
        uses: actions/upload-artifact@v4
        with:
          name: container-${{ matrix.arch }}
          path: result
          retention-days: 1

  container-manifest:
    needs: container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Download container images
        uses: actions/download-artifact@v4
        with:
          pattern: container-*

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          REPO_RAW: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR_MINOR=$(echo "${VERSION}" | cut -d. -f1,2)

          # Build the multi-arch manifest from local archives
          buildah manifest create hofvarpnir
          buildah manifest add hofvarpnir docker-archive:container-amd64/result
          buildah manifest add hofvarpnir docker-archive:container-arm64/result

          # Add OCI annotations to the manifest index
          buildah manifest annotate --index --annotation "org.opencontainers.image.title=hofvarpnir" hofvarpnir
          buildah manifest annotate --index --annotation "org.opencontainers.image.description=Video archival system with yt-dlp" hofvarpnir
          buildah manifest annotate --index --annotation "org.opencontainers.image.url=https://github.com/Mozart409/hofvarpnir" hofvarpnir
          buildah manifest annotate --index --annotation "org.opencontainers.image.source=https://github.com/Mozart409/hofvarpnir" hofvarpnir
          buildah manifest annotate --index --annotation "org.opencontainers.image.documentation=https://github.com/Mozart409/hofvarpnir#readme" hofvarpnir
          buildah manifest annotate --index --annotation "org.opencontainers.image.licenses=SEE LICENSES" hofvarpnir
          buildah manifest annotate --index --annotation "org.opencontainers.image.authors=Mozart409" hofvarpnir
          buildah manifest annotate --index --annotation "org.opencontainers.image.vendor=Mozart409" hofvarpnir
          buildah manifest annotate --index --annotation "org.opencontainers.image.version=${VERSION}" hofvarpnir
          buildah manifest annotate --index --annotation "org.opencontainers.image.revision=${REVISION}" hofvarpnir

          # Push to each tag
          for TAG in "${VERSION}" "${MAJOR_MINOR}" "latest"; do
            buildah manifest push --all hofvarpnir "docker://ghcr.io/${REPO_RAW,,}:${TAG}"
          done

  release:
    needs: [build, container-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Container Image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*.tar.gz
