# Guards the vendored crates under patches/.
#
# patches/yt-dlp-patched declares its own [workspace] table and is not a member
# of the root workspace (members = ["crates/*"]). The root build only ever
# reaches it as a [patch.crates-io] path dependency, and Cargo builds
# dependencies as lib targets only -- so `cargo clippy --all-targets` and
# `cargo test --all-features` at the repo root never compile its tests,
# examples or benches. Without this workflow those targets are compiled by
# nothing, and can sit broken indefinitely (they did: the PlaylistEntry.url
# patch broke them and CI stayed green).
#
# Only runs when patches/ actually changes, so it costs nothing on normal PRs.
# Do NOT mark this a required status check -- the paths filter means it is
# skipped on most PRs, which would block them.
name: Patches
on:
  pull_request:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/patches.yml'
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - '.github/workflows/patches.yml'
    tags-ignore:
      - 'v*.*.*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  vendored-crates:
    name: Type-check vendored crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@b67ad2f0e8376a0bc947db191e4484285b6f5b56 # main
      - name: Setup Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: hofvarpnir
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Type-check only: these are upstream's tests and hit the network when
      # run, so we compile them without executing. Warnings are upstream's
      # (dead-code in test helpers) and are deliberately not gated on.
      - name: Check yt-dlp-patched (all targets)
        run: nix develop .#default --command sh -c "cd patches/yt-dlp-patched && cargo check --all-targets --all-features"
      # `cargo check --all-targets` never compiles doctests, so a doc example
      # broken by a type change (Playlist.title -> Option) went unnoticed.
      # The lib, `unit` and doc tests are offline; run them for real.
      - name: Test yt-dlp-patched (offline targets)
        run: nix develop .#default --command sh -c "cd patches/yt-dlp-patched && cargo test --lib --test unit && cargo test --doc"
