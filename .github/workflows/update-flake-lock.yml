name: update-flake-lock
on:
  workflow_dispatch: # manual trigger
  schedule:
    - cron: "0 4 * * 1" # weekly, Monday 04:00 UTC
permissions:
  contents: write
  pull-requests: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: DeterminateSystems/nix-installer-action@33c9ab3ef95cd57c164d9d6eb1f9a46338538d41 # main
      - uses: DeterminateSystems/update-flake-lock@0281a39e4c38fabb75c9d1377e541666db300909 # main
        with:
          pr-title: "chore(deps): update flake.lock"
          commit-msg: "chore(deps): update flake.lock"
          pr-labels: |
            dependencies
            nix
