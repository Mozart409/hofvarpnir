name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Nix
        uses: cachix/install-nix-action@v24
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      
      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo
            ~/.cache/nix
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: nix develop .#default --command cargo fmt --all -- --check
        
      - name: Run clippy
        run: nix develop .#default --command cargo clippy --all-targets --all-features -- -D warnings
        
      - name: Run tests
        run: nix develop .#default --command cargo test --all-features
        
      - name: Build
        run: nix develop .#default --command cargo build --all-features --release
        
      - name: Run SQLx prepare
        run: nix develop .#default --command just prepare
        
      - name: Run lefthook
        run: nix develop .#default --command lefthook run
        
      - name: Run actionlint
        run: nix develop .#default --command actionlint