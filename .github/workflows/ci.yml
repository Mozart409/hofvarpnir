name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags-ignore:
      - 'v*.*.*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@a7ad9c4f0c65208097f4d34f3cfa1913b80cce5c # main
      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: hofvarpnir
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build binary
        run: nix develop .#ci --command cargo build --release --bin hofvarpnir
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.target }}
          path: target/release/hofvarpnir
          retention-days: 1
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@a7ad9c4f0c65208097f4d34f3cfa1913b80cce5c # main
      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: hofvarpnir
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check formatting
        run: nix develop .#default --command cargo fmt --all -- --check
      - name: Run clippy
        run: nix develop .#default --command cargo clippy --all-targets --all-features -- -D warnings
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hofvarpnir_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hofvarpnir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@a7ad9c4f0c65208097f4d34f3cfa1913b80cce5c # main
      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: hofvarpnir
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Run migrations
        run: nix develop .#default --command sh -c "cd crates/hof-core && sqlx migrate run"
      - name: Run tests
        run: nix develop .#default --command cargo test --all-features -- --include-ignored
  container:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: binary-${{ matrix.target }}
          path: ./bin
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@a7ad9c4f0c65208097f4d34f3cfa1913b80cce5c # main
      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: hofvarpnir
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build container from binary
        run: |
          chmod +x ./bin/hofvarpnir
          HOFVARPNIR_BINARY="$(pwd)/bin/hofvarpnir"
          export HOFVARPNIR_BINARY
          # --fallback: build a dependency from source if its binary-cache
          # substitute fails (e.g. a corrupted NAR on cache.nixos.org).
          nix build --impure --fallback .#containerFromBinary
      - name: Upload container image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: container-${{ matrix.arch }}
          path: result
          retention-days: 1
  container-manifest:
    needs: [lint, test, build, container]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Download container images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: container-*
      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifest
        env:
          REPO: ${{ github.repository }}
        run: |
          REPO_LOWER="${REPO,,}"

          buildah manifest create hofvarpnir
          buildah manifest add hofvarpnir docker-archive:container-amd64/result
          buildah manifest add hofvarpnir docker-archive:container-arm64/result

          # Docker rejects GHCR tags that are published only as OCI indexes.
          buildah manifest push --all --format v2s2 hofvarpnir "docker://ghcr.io/${REPO_LOWER}:dev"

          # Keep a pure OCI variant available for OCI-native consumers.
          buildah manifest push --all --format oci hofvarpnir "docker://ghcr.io/${REPO_LOWER}:dev-oci"
      - name: Verify pushed manifests resolve
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          REPO_LOWER="ghcr.io/${REPO,,}"

          # Fetch the index AND every per-arch child manifest it references.
          # `docker manifest inspect` only reads the index, so it passes even
          # when the platform children are missing. Pulling each child digest is
          # cheap (manifest JSON, not layers) and reproduces what a real pull
          # needs.
          verify() {
            ref="$1"
            echo "::group::verify ${ref}"
            digests="$(docker buildx imagetools inspect --raw "${ref}" | jq -r '.manifests[]?.digest')"
            if [ -z "${digests}" ]; then
              echo "::error::${ref} has no child manifests"; exit 1
            fi
            for d in ${digests}; do
              docker buildx imagetools inspect --raw "${REPO_LOWER}@${d}" >/dev/null \
                || { echo "::error::${ref} -> child ${d} is unresolvable"; exit 1; }
              echo "ok  ${d}"
            done
            echo "::endgroup::"
          }

          for tag in dev dev-oci; do
            verify "${REPO_LOWER}:${tag}"
          done
