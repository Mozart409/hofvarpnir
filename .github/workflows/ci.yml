name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: cachix/install-nix-action@v24
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo
            ~/.cache/nix
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check formatting
        run: nix develop .#default --command cargo fmt --all -- --check
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: cachix/install-nix-action@v24
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo
            ~/.cache/nix
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run clippy
        run: nix develop .#default --command cargo clippy --all-targets --all-features -- -D warnings
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: cachix/install-nix-action@v24
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo
            ~/.cache/nix
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Run tests
        run: nix develop .#default --command cargo test --all-features
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Nix
        uses: cachix/install-nix-action@v24
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            experimental-features = nix-command flakes
      - name: Setup cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/cargo
            ~/.cache/nix
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build
        run: nix develop .#default --command cargo build --all-features --release

  container:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Setup Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build container
        run: nix build .#container

      - name: Push arch-specific image to GHCR (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          REPO: ${{ github.repository }}
        run: |
          nix develop .#default --command skopeo copy \
            --dest-creds="${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            docker-archive:result \
            "docker://ghcr.io/${REPO,,}:dev-${{ matrix.arch }}"

  container-manifest:
    needs: container
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Create and push multi-arch manifest
        env:
          REPO: ${{ github.repository }}
        run: |
          REPO_LOWER="${REPO,,}"
          
          nix develop .#default --command skopeo login \
            -u "${{ github.actor }}" \
            -p "${{ secrets.GITHUB_TOKEN }}" \
            ghcr.io

          # Create manifest list combining both architectures
          docker manifest create "ghcr.io/${REPO_LOWER}:dev" \
            "ghcr.io/${REPO_LOWER}:dev-amd64" \
            "ghcr.io/${REPO_LOWER}:dev-arm64"

          docker manifest push "ghcr.io/${REPO_LOWER}:dev"
