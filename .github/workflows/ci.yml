name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags-ignore:
      - 'v*.*.*'
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@main
      - name: Check formatting
        run: nix develop .#default --command cargo fmt --all -- --check
      - name: Run clippy
        run: nix develop .#default --command cargo clippy --all-targets --all-features -- -D warnings
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hofvarpnir_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hofvarpnir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@main
      - name: Run migrations
        run: nix develop .#default --command sh -c "cd crates/hof-core && sqlx migrate run"
      - name: Run tests
        run: nix develop .#default --command cargo test --all-features -- --include-ignored
  container:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Setup Nix
        uses: DeterminateSystems/nix-installer-action@main
      - name: Setup Nix cache
        uses: DeterminateSystems/flakehub-cache-action@main
      - name: Build container
        run: nix build .#container
      - name: Upload container image
        uses: actions/upload-artifact@v7
        with:
          name: container-${{ matrix.arch }}
          path: result
          retention-days: 1
  container-manifest:
    needs: [lint, test, container]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Download container images
        uses: actions/download-artifact@v8
        with:
          pattern: container-*
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push multi-arch manifest
        env:
          REPO: ${{ github.repository }}
        run: |
          REPO_LOWER="${REPO,,}"

          buildah manifest create hofvarpnir
          buildah manifest add hofvarpnir docker-archive:container-amd64/result
          buildah manifest add hofvarpnir docker-archive:container-arm64/result
          buildah manifest push --all hofvarpnir "docker://ghcr.io/${REPO_LOWER}:dev"
