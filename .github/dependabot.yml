# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuring-dependabot-version-updates
version: 2
updates:
  # Rust/Cargo dependencies
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      # `include: scope` appends Dependabot's own "(deps)"/"(deps-dev)", so the
      # prefix must not carry a scope of its own.
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      # No `include: scope`: it would append "(deps)" -> "chore(ci)(deps):".
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
