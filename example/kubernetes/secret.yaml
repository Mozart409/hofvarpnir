# Hofvarpnir Secrets
# WARNING: For production, use a secret management solution (Sealed Secrets, External Secrets, Vault)
# These are base64 encoded example values - DO NOT use in production!
apiVersion: v1
kind: Secret
metadata:
  name: hofvarpnir-secrets
  namespace: hofvarpnir
  labels:
    app.kubernetes.io/name: hofvarpnir
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Using stringData for readability - Kubernetes will base64 encode automatically
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/hofvarpnir"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "hofvarpnir"
