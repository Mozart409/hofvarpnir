services:
  # Hofvarpnir video archival service
  # Build the container using Nix:
  #   nix build .#container && docker load < result
  # Or pull from registry:
  #   image: ghcr.io/user/hofvarpnir:latest
  hofvarpnir:
    container_name: hofvarpnir
    image: hofvarpnir:latest
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hofvarpnir_dev
      RUST_LOG: info,hof_core=debug
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      # Main downloads directory - shared with Jellyfin/Syncthing
      # Use same UID:GID (1000:1000) as container for permission compatibility
      - ${DOWNLOAD_DIR:-./downloads}:/data/downloads
      # Incomplete downloads - separate to avoid Jellyfin scanning partial files
      - ${INCOMPLETE_DIR:-./incomplete}:/data/incomplete
    networks:
      - hofvarpnir
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Run as UID:GID 1000:1000 for Jellyfin/Syncthing compatibility
    # Adjust if your media user has a different UID
    user: "1000:1000"
    restart: unless-stopped

  postgres:
    container_name: postgres
    build:
      context: ..
      dockerfile: docker/postgres.Dockerfile
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hofvarpnir_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hofvarpnir
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres_exporter:
    container_name: postgres_exporter
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/hofvarpnir_dev?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    ports:
      - "9187:9187"
    volumes:
      - ./postgres_exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    networks:
      - hofvarpnir
    depends_on:
      - postgres
    command:
      - '--extend.query-path=/etc/postgres_exporter/queries.yaml'

volumes:
  postgres_data:
    driver: local

networks:
  hofvarpnir:
    driver: bridge
