[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.15"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.94.0"

[workspace.metadata.crane]
name = "hofvarpnir"

[workspace.dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6.5"
crossterm = "0.29"
dotenvy = "0.15"
futures = "0.3"
http = "1"
kameo = "0.20"
metrics = "0.24"
opentelemetry = { version = "0.31", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace", "rt-tokio", "internal-logs"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "http-proto", "trace", "internal-logs"] }
tracing-opentelemetry = { version = "0.32", default-features = false }
metrics-exporter-prometheus = { version = "0.18", default-features = false }
maud = { version = "0.27", features = ["axum"] }
mime_guess = "2"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "postgres",
    "chrono",
    "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "request-id", "propagate-header"] }
tower-sessions = "0.15"
tower-sessions-core = "0.15"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"], git = "https://github.com/maxcountryman/tower-sessions-stores" }
tracing = "0.1"
tracing-loki = { version = "0.2", default-features = false, features = ["compat-0-2-1", "rustls"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "1", features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "ulid"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
wiremock = "0.6"
yt-dlp = "2.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Selectively allow noisy pedantic lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Selectively allow noisy nursery lints
exhaustive_structs = "allow"
needless_pass_by_ref_mut = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
redundant_pub_crate = "allow"

