[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.97.1"

[workspace.metadata.crane]
name = "hofvarpnir"

[workspace.dependencies]
argon2 = "0.5"
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6.5"
crossterm = "0.29"
dotenvy = "0.15"
futures = "0.3"
http = "1"
kameo = "0.22"
metrics = "0.24"
opentelemetry = { version = "0.32", default-features = false, features = ["trace", "internal-logs"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "rt-tokio", "internal-logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "http-proto", "trace", "internal-logs"] }
tracing-opentelemetry = { version = "0.33", default-features = false }
metrics-exporter-prometheus = { version = "0.18", default-features = false }
maud = { version = "0.27", features = ["axum"] }
mime_guess = "2"
percent-encoding = "2"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio","tls-rustls-aws-lc-rs", "postgres", "chrono", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "fs", "request-id", "propagate-header"] }
tower-sessions = "0.15"
tower-sessions-core = "0.15"
# Vendored + patched for sqlx 0.9 (upstream still pins sqlx 0.8). See patches/tower-sessions-sqlx-store.
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"], path = "patches/tower-sessions-sqlx-store" }
tracing = "0.1"
tracing-loki = { version = "0.2", default-features = false, features = ["compat-0-2-1", "rustls"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ulid = { version = "3", features = ["serde"] }
utoipa = { version = "5", features = ["axum_extras", "chrono", "ulid"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
wiremock = "0.6"
yt-dlp = "2.7"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
# `arithmetic_side_effects` and `string_slice` are clippy `restriction`-group
# lints, which upstream documents as a menu for safety-critical code rather
# than a general quality baseline. Enabled wholesale they accounted for 63 of
# 80 errors here, almost all of them ceremony: `saturating_add` on counters
# that cannot overflow, and UTF-8 guards on ASCII-structured parsing that is
# already correct. Worse, mechanical "fixes" to the string-slicing sites risk
# silently changing yt-dlp output parsing.
#
# These are `allow` rather than `warn` deliberately: `just lint` and the
# lefthook hooks pass `-D warnings`, which promotes every warning to an error,
# so `warn` would still block every commit.
arithmetic_side_effects = "allow"
string_slice = "allow"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
# Selectively allow noisy pedantic lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Selectively allow noisy nursery lints
exhaustive_structs = "allow"
needless_pass_by_ref_mut = "allow"
option_if_let_else = "allow"
significant_drop_tightening = "allow"
redundant_pub_crate = "allow"

# Build-time profile tuning. Full debuginfo on every dependency is the single
# largest avoidable cost in the dev/test loop: it is generated on every
# compile and re-linked into every test binary, and this workspace has ~600
# dependencies against four crates of our own.
#
# Dependencies drop debuginfo entirely — stepping through `rustls` internals
# in a debugger is not something this project does. Workspace crates keep
# line tables, so panic backtraces still name the file and line; only
# variable inspection is lost. Restore with `debug = true` here if you need
# a full debugger session.
#
# `just ci` and the release build are unaffected (release profile untouched).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Vendored yt-dlp: makes Playlist.title, PlaylistEntry.title and PlaylistEntry.url
# optional, so a single private/deleted video does not fail the whole playlist
# parse. See patches/yt-dlp-patched/PATCHES.md for the full delta and the
# re-sync procedure.
[patch.crates-io]
yt-dlp = { path = "patches/yt-dlp-patched" }
